<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141519"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </linearGradient>

    <!-- Web Primary Accent Orange (#ff7a45) -->
    <linearGradient id="bdOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffa26e"/>
      <stop offset="40%" stop-color="#ff7a45"/>
      <stop offset="100%" stop-color="#e65818"/>
    </linearGradient>

    <!-- Upper Chamber Gradient (Slightly lighter top illumination) -->
    <linearGradient id="bdUpper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffab7c"/>
      <stop offset="100%" stop-color="#ff7a45"/>
    </linearGradient>

    <!-- Lower Chamber Gradient (Solid rich orange) -->
    <linearGradient id="bdLower" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a45"/>
      <stop offset="100%" stop-color="#de4d13"/>
    </linearGradient>

    <!-- Soft Orange Ambient Aura -->
    <radialGradient id="bdGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7a45" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ff7a45" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Obsidian Container with 1px Precision Border -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bdBg)" stroke="#26292f" stroke-width="2"/>

  <!-- Ambient Glow Behind Icon -->
  <circle cx="64" cy="64" r="48" fill="url(#bdGlow)"/>

  <!-- Architectural Corner Dimension Marks (Faint Orange Ticks) -->
  <g stroke="#ff7a45" stroke-width="1.5" stroke-linecap="round" opacity="0.45">
    <path d="M 16 26 L 16 16 L 26 16"/>
    <path d="M 112 26 L 112 16 L 102 16"/>
    <path d="M 16 102 L 16 112 L 26 112"/>
    <path d="M 112 102 L 112 112 L 102 112"/>
  </g>

  <!-- MAIN GLYPH: Bold Architectural Monogram "B" -->
  <!-- 1. Left Foundation Pillar (Vertical Stem) -->
  <rect x="28" y="26" width="14" height="76" rx="4" fill="url(#bdOrange)"/>

  <!-- 2. Upper Architectural Chamber (Loop 1) -->
  <path d="M 42 26 H 68 C 82 26 91.5 34.5 91.5 46.5 C 91.5 58.5 82 66 68 66 H 42 Z"
        fill="none" stroke="url(#bdUpper)" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 3. Lower Architectural Chamber (Loop 2, Wider Bold Stance) -->
  <path d="M 42 63 H 72.5 C 87.5 63 98 72 98 84 C 98 96 87.5 104.5 72.5 104.5 H 42 Z"
        fill="none" stroke="url(#bdLower)" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 4. Clean Architectural Slit (Negative Space Separator) -->
  <line x1="42" y1="64.5" x2="71" y2="64.5" stroke="#0a0b0d" stroke-width="4.5" stroke-linecap="round"/>

  <!-- 5. Foundation Scale Mark (High Contrast White Tick on Stem) -->
  <rect x="29" y="63" width="7" height="3" rx="1.5" fill="#ffffff" opacity="0.95"/>

  <!-- 6. Precision Architectural Apex Nodes (White Spark Dots) -->
  <circle cx="91.5" cy="46.5" r="3" fill="#ffffff" opacity="0.95"/>
  <circle cx="98" cy="84" r="3.4" fill="#ffffff" opacity="0.95"/>
</svg>
